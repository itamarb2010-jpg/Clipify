# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties — Minecraft 26.1.2 (Java 25). Yarn has no 26.x mappings, so this build uses
# official Mojang mappings; that is why the Minecraft names in the source differ from the 1.21.11
# (Yarn) build.
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17.16

# Mod Properties
mod_version=2.0.0
maven_group=dev.clipify
archives_base_name=clipify

# Dependencies
fabric_api_version=0.155.2+26.1.2
modmenu_version=18.0.0
